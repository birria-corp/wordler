<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#121213" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Wordler" />
  <title>Wordler</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Clear+Sans:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #121213;
      --surface:   #1a1a1b;
      --surface2:  #272729;
      --border:    #3a3a3c;
      --text:      #ffffff;
      --muted:     #818384;
      --gray:      #3a3a3c;
      --yellow:    #b59f3b;
      --green:     #538d4e;
      --blue:      #85c0f9;
      --tile-bg:   #121213;
      --header-h:  50px;
      --safe-top:  env(safe-area-inset-top, 0px);
      --safe-bot:  env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: calc(var(--safe-top) + 8px) 16px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      height: calc(var(--header-h) + var(--safe-top));
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--text);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }

    .icon-btn:active { opacity: 0.6; }

    /* ── MAIN LAYOUT ── */
    .app-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .guess-section {
      flex-shrink: 0;
      padding: 8px 16px 4px;
      border-bottom: 1px solid var(--border);
    }

    /* ── GUESS GRID ── */
    .grid-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
    }

    .grid {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      gap: 5px;
    }

    .grid-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }

    .tile {
      width: 44px;
      height: 44px;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.1s, border-color 0.1s;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .tile.has-letter { border-color: var(--muted); }
    .tile.gray   { background: var(--gray);   border-color: var(--gray);   color: #fff; }
    .tile.yellow { background: var(--yellow); border-color: var(--yellow); color: #fff; }
    .tile.green  { background: var(--green);  border-color: var(--green);  color: #fff; }

    .tile.active-row { border-color: var(--muted); }

    /* ── GUESS INPUT ── */
    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .guess-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 9px 12px;
      outline: none;
      text-transform: uppercase;
      -webkit-appearance: none;
    }
    .guess-input:focus { border-color: var(--muted); }
    .guess-input::placeholder { color: var(--muted); font-weight: 400; letter-spacing: normal; font-size: 0.9rem; }

    .submit-btn {
      background: var(--green);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 10px 14px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .submit-btn:active { opacity: 0.8; }

    .hint-text {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 4px;
      text-align: center;
    }

    /* ── RESULTS SECTION ── */
    .results-section {
      flex: 1;
      display: flex;
      gap: 0;
      overflow: hidden;
    }

    /* ── WORD LIST ── */
    .word-list-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 8px 12px 6px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .word-count-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--green);
      font-variant-numeric: tabular-nums;
    }

    .word-count-badge.warn { color: var(--yellow); }
    .word-count-badge.danger { color: #cc4444; }

    .word-grid {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 4px;
      -webkit-overflow-scrolling: touch;
    }

    .word-chip {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      padding: 3px 4px;
      border-radius: 4px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: default;
      user-select: none;
      display: inline-flex;
      gap: 1px;
    }

    /* Per-letter span inside word chip */
    .word-chip .ltr {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 20px;
      border-radius: 3px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    /* Previously used Wordle answer — shown with blue border */
    .word-chip.past-answer {
      border-color: var(--blue);
    }
    .word-chip.past-answer .ltr {
      color: #b8d8f8;
    }

    /* ── LETTER FREQ PANEL ── */
    .letter-panel {
      width: 80px;
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .letter-rows {
      flex: 1;
      overflow-y: auto;
      padding: 4px 4px;
      -webkit-overflow-scrolling: touch;
    }

    .letter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 4px;
      border-radius: 4px;
      margin-bottom: 2px;
    }

    .letter-row:first-child { margin-top: 2px; }

    .letter-char {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text);
      width: 18px;
    }

    .letter-bar-wrap {
      flex: 1;
      height: 6px;
      background: var(--surface2);
      border-radius: 3px;
      margin: 0 5px;
      overflow: hidden;
    }

    .letter-bar {
      height: 100%;
      background: var(--green);
      border-radius: 3px;
      transition: width 0.2s;
    }

    .letter-count {
      font-size: 0.65rem;
      color: var(--muted);
      width: 22px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      top: calc(var(--header-h) + var(--safe-top) + 12px);
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: var(--text);
      color: var(--bg);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 200;
      white-space: nowrap;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── RESET BTN ── */
    .reset-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 6px 10px;
      cursor: pointer;
      margin-left: 4px;
    }
    .reset-btn:active { background: var(--surface2); }

    /* ── EMPTY STATE ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 6px;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
      padding: 16px;
    }

    .empty-state .big {
      font-size: 1.8rem;
    }

    /* ── PAST ANSWER LEGEND ── */
    .legend {
      padding: 4px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .legend-dot {
      width: 8px; height: 8px;
      border-radius: 2px;
      border: 1px solid var(--blue);
      background: transparent;
      flex-shrink: 0;
    }

    .legend-text {
      font-size: 0.6rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    /* ── FOOTER ── */
    .app-footer {
      flex-shrink: 0;
      text-align: center;
      padding: 4px 0 calc(4px + var(--safe-bot));
      font-size: 0.6rem;
      color: var(--border);
      letter-spacing: 0.08em;
      font-family: inherit;
      border-top: 1px solid var(--surface2);
      background: var(--bg);
    }

    /* ── SCROLLBAR STYLING ── */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    @media (min-width: 400px) {
      .tile { width: 50px; height: 50px; font-size: 1.2rem; }
      .letter-panel { width: 90px; }
    }

    @media (min-width: 500px) {
      .tile { width: 56px; height: 56px; font-size: 1.3rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">WORDLER</div>
  <div class="header-right">
    <button class="reset-btn" id="resetBtn" onclick="resetAll()">NEW PUZZLE</button>
  </div>
</header>

<div class="app-body">

  <!-- GUESS GRID + INPUT -->
  <div class="guess-section">
    <div class="grid-wrap">
      <div class="grid" id="grid"></div>
    </div>
    <div class="input-row">
      <input
        class="guess-input"
        id="guessInput"
        type="text"
        maxlength="5"
        placeholder="Enter guess word…"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        inputmode="text"
      />
      <button class="submit-btn" onclick="submitGuess()">ADD</button>
    </div>
    <div class="hint-text">Tap letter to cycle: ⬜ → ⬛ GRAY → 🟨 YELLOW → 🟩 GREEN</div>
  </div>

  <!-- RESULTS -->
  <div class="results-section">

    <!-- WORD LIST -->
    <div class="word-list-panel">
      <div class="panel-header">
        <span class="panel-title">Possible Words</span>
        <span class="word-count-badge" id="wordCountBadge">—</span>
      </div>
      <div class="legend" id="pastLegend" style="display:none">
        <div class="legend-dot"></div>
        <span class="legend-text">Blue border = previously used Wordle answer</span>
      </div>
      <div class="word-grid" id="wordGrid">
        <div class="empty-state">
          <div class="big">🟩</div>
          <div>Enter your first guess above.<br>Tap each letter to set its color.</div>
        </div>
      </div>
    </div>

    <!-- LETTER FREQUENCY -->
    <div class="letter-panel">
      <div class="panel-header" style="padding:8px 6px 6px;">
        <span class="panel-title" style="font-size:0.58rem;">LETTERS</span>
      </div>
      <div class="letter-rows" id="letterRows">
      </div>
    </div>

  </div>
</div>

<footer class="app-footer">WORDLER v1.0</footer>

<div id="toast"></div>

// Past Wordle answers — fetched at runtime, cached daily in localStorage
// Falls back to empty set if offline
let PAST_ANSWERS = new Set();

async function fetchPastAnswers() {
  const cacheKey = 'wordler_past_v1';
  const dateKey  = 'wordler_past_date';
  const today = new Date().toISOString().slice(0, 10);

  const cached = localStorage.getItem(cacheKey);
  const cachedDate = localStorage.getItem(dateKey);

  if (cached && cachedDate === today) {
    PAST_ANSWERS = new Set(JSON.parse(cached));
    renderWordList();
    return;
  }

  // Try multiple public sources for NYT Wordle answers
  const sources = [
    'https://raw.githubusercontent.com/tabatkins/wordle-list/main/words',
  ];

  // Use the wordle-answers endpoint from wordle.votable.app CORS proxy
  try {
    const r = await fetch('https://wordle.votable.app/api/answers', { signal: AbortSignal.timeout(5000) });
    if (r.ok) {
      const data = await r.json();
      const answers = (data.answers || data || []).map(w => w.toUpperCase()).filter(w => w.length === 5);
      if (answers.length > 100) {
        PAST_ANSWERS = new Set(answers);
        localStorage.setItem(cacheKey, JSON.stringify(answers));
        localStorage.setItem(dateKey, today);
        renderWordList();
        return;
      }
    }
  } catch {}

  // Fallback: try known-good GitHub source for historical answers
  try {
    const r = await fetch('https://raw.githubusercontent.com/tabatkins/wordle-list/main/answers', { signal: AbortSignal.timeout(5000) });
    if (r.ok) {
      const text = await r.text();
      const answers = text.trim().split('\n').map(w => w.trim().toUpperCase()).filter(w => w.length === 5);
      if (answers.length > 100) {
        PAST_ANSWERS = new Set(answers);
        localStorage.setItem(cacheKey, JSON.stringify(answers));
        localStorage.setItem(dateKey, today);
        renderWordList();
        return;
      }
    }
  } catch {}
}

// ═══════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════
// guesses: array of { word: string, tiles: ['gray'|'yellow'|'green'|'empty', ...] }
let guesses = [];
let activeRow = 0; // which row is being edited

const CYCLE = ['empty', 'gray', 'yellow', 'green'];

// ═══════════════════════════════════════════════════
// GRID
// ═══════════════════════════════════════════════════
function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let r = 0; r < 6; r++) {
    const row = document.createElement('div');
    row.className = 'grid-row';
    row.id = `row-${r}`;
    for (let c = 0; c < 5; c++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.id = `tile-${r}-${c}`;
      tile.dataset.row = r;
      tile.dataset.col = c;
      tile.addEventListener('click', onTileClick);
      row.appendChild(tile);
    }
    grid.appendChild(row);
  }
  updateGridDisplay();
}

function updateGridDisplay() {
  for (let r = 0; r < 6; r++) {
    const guess = guesses[r];
    for (let c = 0; c < 5; c++) {
      const tile = document.getElementById(`tile-${r}-${c}`);
      const letter = guess ? guess.word[c] || '' : '';
      const state  = guess ? guess.tiles[c] : 'empty';

      tile.textContent = letter;
      tile.className = 'tile';
      if (letter) tile.classList.add('has-letter');
      if (state !== 'empty') tile.classList.add(state);
      if (r === activeRow && !guess) tile.classList.add('active-row');
    }
  }
}

function onTileClick(e) {
  const r = parseInt(e.target.dataset.row);
  const c = parseInt(e.target.dataset.col);
  if (!guesses[r]) return; // row not yet filled

  const tiles = guesses[r].tiles;
  const cur = tiles[c];
  const idx = CYCLE.indexOf(cur);
  tiles[c] = CYCLE[(idx + 1) % CYCLE.length];

  updateGridDisplay();
  updateResults();
}

// ═══════════════════════════════════════════════════
// GUESS SUBMISSION
// ═══════════════════════════════════════════════════
function submitGuess() {
  const input = document.getElementById('guessInput');
  const word = input.value.trim().toUpperCase();

  if (word.length !== 5) {
    showToast('Enter a 5-letter word');
    return;
  }
  if (!/^[A-Z]{5}$/.test(word)) {
    showToast('Letters only');
    return;
  }
  if (activeRow >= 6) {
    showToast('No more rows — start new puzzle');
    return;
  }

  guesses[activeRow] = { word, tiles: ['empty','empty','empty','empty','empty'] };
  activeRow++;

  input.value = '';
  updateGridDisplay();
  updateResults();
  input.focus();
}

document.getElementById('guessInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitGuess();
});

// ═══════════════════════════════════════════════════
// FILTER ENGINE
// ═══════════════════════════════════════════════════
function buildConstraints() {
  // Returns constraint object derived from all submitted guesses
  const excludeLetters = new Set();           // gray: definitely not in word
  const includeLetters = new Set();           // yellow+green: must be in word
  const greenAt = {};                         // pos -> letter (must be here)
  const notAt = { 0:new Set(),1:new Set(),2:new Set(),3:new Set(),4:new Set() }; // yellow: not at this pos

  for (const { word, tiles } of guesses) {
    for (let i = 0; i < 5; i++) {
      const letter = word[i];
      const state = tiles[i];
      if (state === 'gray') {
        // Only add to excludeLetters if this letter is NOT green/yellow elsewhere in same word
        const appearsElsewhere = tiles.some((t, j) => j !== i && word[j] === letter && (t === 'yellow' || t === 'green'));
        if (!appearsElsewhere) excludeLetters.add(letter);
      } else if (state === 'yellow') {
        includeLetters.add(letter);
        notAt[i].add(letter);
      } else if (state === 'green') {
        greenAt[i] = letter;
        includeLetters.add(letter);
      }
      // empty tiles: no constraint yet
    }
  }

  return { excludeLetters, includeLetters, greenAt, notAt };
}

function filterWords() {
  if (guesses.length === 0 || guesses.every(g => g.tiles.every(t => t === 'empty'))) {
    return WORDS; // no constraints yet — show all
  }

  const { excludeLetters, includeLetters, greenAt, notAt } = buildConstraints();

  return WORDS.filter(word => {
    // 1. No excluded letters (unless same letter also used as green/yellow)
    for (const ch of excludeLetters) {
      if (word.includes(ch)) return false;
    }
    // 2. Green positions
    for (const [pos, ch] of Object.entries(greenAt)) {
      if (word[parseInt(pos)] !== ch) return false;
    }
    // 3. Yellow: must be in word
    for (const ch of includeLetters) {
      if (!word.includes(ch)) return false;
    }
    // 4. Yellow: not at forbidden positions
    for (const [pos, letters] of Object.entries(notAt)) {
      if (letters.has(word[parseInt(pos)])) return false;
    }
    return true;
  });
}

  renderWordList();
  renderLetterFreq();
}

// ═══════════════════════════════════════════════════
// COLOR HELPERS
// ═══════════════════════════════════════════════════

// Word frequency gradient: yellow (#b59f3b) → red (#cc3333)
// t=0 → most common (yellow), t=1 → least common (red)
function wordFreqColor(t) {
  // Clamp
  t = Math.max(0, Math.min(1, t));
  // Yellow [181,159,59] → Red [204,51,51]
  const r = Math.round(181 + t * (204 - 181));
  const g = Math.round(159 + t * (51  - 159));
  const b = Math.round(59  + t * (51  - 59));
  return `rgb(${r},${g},${b})`;
}

// Letter frequency tint: green (#538d4e) → blue (#3a7bd5)
// t=0 → most frequent letter (green), t=1 → least frequent (blue)
function letterFreqColor(t) {
  t = Math.max(0, Math.min(1, t));
  // Green [83,141,78] → Blue [58,123,213]
  const r = Math.round(83  + t * (58  - 83));
  const g = Math.round(141 + t * (123 - 141));
  const b = Math.round(78  + t * (213 - 78));
  return `rgba(${r},${g},${b},0.35)`;
}

// ═══════════════════════════════════════════════════
// COMPUTE LETTER COUNTS (shared by both renderers)
// ═══════════════════════════════════════════════════
function computeLetterCounts(filtered) {
  const { excludeLetters, greenAt } = buildConstraints();
  const counts = {};
  for (const word of filtered) {
    const seen = new Set();
    for (let i = 0; i < 5; i++) {
      const ch = word[i];
      if (seen.has(ch)) continue;
      if (excludeLetters.has(ch)) continue;
      seen.add(ch);
      counts[ch] = (counts[ch] || 0) + 1;
    }
  }
  // Remove confirmed greens
  for (const ch of Object.values(greenAt)) delete counts[ch];
  return counts;
}

// ═══════════════════════════════════════════════════
// RENDER WORD LIST
// ═══════════════════════════════════════════════════
function renderWordList() {
  const filtered = filterWords();
  const grid = document.getElementById('wordGrid');
  const badge = document.getElementById('wordCountBadge');
  const legend = document.getElementById('pastLegend');

  badge.textContent = filtered.length.toLocaleString();
  badge.className = 'word-count-badge';
  if (filtered.length <= 50) badge.classList.add('warn');
  if (filtered.length <= 10) badge.classList.add('danger');

  if (filtered.length === WORDS.length) {
    grid.innerHTML = `<div class="empty-state"><div class="big">🟩</div><div>Enter your first guess above.<br>Tap each letter to set its color.</div></div>`;
    legend.style.display = 'none';
    return;
  }

  const hasPast = filtered.some(w => PAST_ANSWERS.has(w));
  legend.style.display = hasPast ? '' : 'none';

  // Build letter frequency map for tint
  const letterCounts = computeLetterCounts(filtered);
  const maxLetterCount = Math.max(...Object.values(letterCounts), 1);

  const MAX_DISPLAY = 500;
  const show = filtered.slice(0, MAX_DISPLAY);
  const totalShow = show.length;

  let html = '';
  for (let i = 0; i < totalShow; i++) {
    const w = show[i];
    const isPast = PAST_ANSWERS.has(w);

    // Word frequency gradient: position in filtered array → t value
    // Use log scale so common words aren't all the same color
    const rawT = totalShow > 1 ? i / (totalShow - 1) : 0;
    const t = Math.pow(rawT, 0.5); // sqrt easing — spreads gradient toward common end
    const chipColor = wordFreqColor(t);

    // Build per-letter spans with tint
    let lettersHtml = '';
    for (const ch of w) {
      const count = letterCounts[ch] || 0;
      const lt = count > 0 ? 1 - (count / maxLetterCount) : 1; // 0=most freq, 1=least
      const bgColor = letterFreqColor(lt);
      lettersHtml += `<span class="ltr" style="background:${bgColor}">${ch}</span>`;
    }

    html += `<div class="word-chip${isPast ? ' past-answer' : ''}" style="border-color:${chipColor}33;color:${chipColor}">${lettersHtml}</div>`;
  }

  if (filtered.length > MAX_DISPLAY) {
    html += `<div style="width:100%;padding:6px;text-align:center;font-size:0.7rem;color:var(--muted)">+${(filtered.length - MAX_DISPLAY).toLocaleString()} more — add more clues to narrow down</div>`;
  }

  grid.innerHTML = html;
}

// ═══════════════════════════════════════════════════
// LETTER FREQUENCY PANEL
// ═══════════════════════════════════════════════════
function renderLetterFreq() {
  const filtered = filterWords();
  const counts = computeLetterCounts(filtered);

  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const maxCount = sorted.length > 0 ? sorted[0][1] : 1;

  const container = document.getElementById('letterRows');
  if (sorted.length === 0) {
    container.innerHTML = `<div style="padding:8px 4px;font-size:0.62rem;color:var(--muted);text-align:center;">—</div>`;
    return;
  }

  let html = '';
  for (let i = 0; i < sorted.length; i++) {
    const [ch, count] = sorted[i];
    const pct = Math.round((count / maxCount) * 100);
    // Panel bar uses same green→blue gradient as letter tints
    const t = sorted.length > 1 ? i / (sorted.length - 1) : 0;
    // Bar color: solid version (no alpha) of letterFreqColor
    const lt = 1 - (count / maxCount); // high count = low t = green
    const r = Math.round(83  + lt * (58  - 83));
    const g = Math.round(141 + lt * (123 - 141));
    const b = Math.round(78  + lt * (213 - 78));
    const barColor = `rgb(${r},${g},${b})`;
    html += `
      <div class="letter-row">
        <span class="letter-char">${ch}</span>
        <div class="letter-bar-wrap"><div class="letter-bar" style="width:${pct}%;background:${barColor}"></div></div>
        <span class="letter-count">${count}</span>
      </div>`;
  }
  container.innerHTML = html;
}

// ═══════════════════════════════════════════════════
// RESET
// ═══════════════════════════════════════════════════
function resetAll() {
  guesses = [];
  activeRow = 0;
  document.getElementById('guessInput').value = '';
  buildGrid();
  updateResults();
  renderLetterFreq();
  document.getElementById('wordGrid').innerHTML = `<div class="empty-state"><div class="big">🟩</div><div>Enter your first guess above.<br>Tap each letter to set its color.</div></div>`;
  document.getElementById('letterRows').innerHTML = '';
  document.getElementById('wordCountBadge').textContent = '—';
  document.getElementById('pastLegend').style.display = 'none';
}

// ═══════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
buildGrid();
renderLetterFreq();

// Show total word count on load
document.getElementById('wordCountBadge').textContent = WORDS.length.toLocaleString();

// Fetch past answers async
fetchPastAnswers().catch(() => {});

// Auto-focus input on desktop
if (window.innerWidth > 600) {
  document.getElementById('guessInput').focus();
}

// PWA service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
